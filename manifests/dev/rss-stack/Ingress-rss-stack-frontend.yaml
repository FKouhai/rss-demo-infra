apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: fkouhailabs
  labels:
    app.kubernetes.io/instance: rss-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss-frontend
    app.kubernetes.io/part-of: rss-stack
  name: rss-stack-frontend
  namespace: demo
spec:
  rules:
    - host: rss.fkouhailabs.net
      http:
        paths:
          - backend:
              service:
                name: rss-stack-frontend
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - rss.fkouhailabs.net
      secretName: rss-http-tls
