apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rss-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss-notify
    app.kubernetes.io/part-of: rss-stack
  name: rss-stack-notify
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rss-stack
      app.kubernetes.io/name: rss-notify
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rss-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rss-notify
        app.kubernetes.io/part-of: rss-stack
    spec:
      containers:
        - env:
            - name: SERVICE_FQDN
              value: rss-stack-notify:3000
            - name: OTEL_EP
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: NATS_URL
              value: nats://rss-stack-nats.demo.svc.cluster.local:4222
            - name: NOTIFY_NATS_RETRY_BUDGET
              value: 60s
            - name: NOTIFY_MAX_ITEM_AGE
              value: 2h
          image: ghcr.io/fkouhai/rss_notify-x86_64-linux:2.0.0-rc-3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: notify
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
