apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rss-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss-aggregator
    app.kubernetes.io/part-of: rss-stack
  name: rss-stack-aggregator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rss-stack
      app.kubernetes.io/name: rss-aggregator
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app.kubernetes.io/instance: rss-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rss-aggregator
        app.kubernetes.io/part-of: rss-stack
    spec:
      containers:
        - env:
            - name: SERVICE_FQDN
              value: rss-stack-aggregator:3000
            - name: OTEL_EP
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: NATS_URL
              value: nats://rss-stack-nats.demo.svc.cluster.local:4222
            - name: AGGREGATOR_NATS_RETRY_BUDGET
              value: 60s
            - name: AGGREGATOR_DB_DRIVER
              value: postgres
            - name: AGGREGATOR_DB_DSN
              valueFrom:
                secretKeyRef:
                  key: dsn
                  name: rss-aggregator-db
          image: ghcr.io/fkouhai/rss_aggregator-x86_64-linux:2.0.1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: aggregator
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
