apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rss-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss-config
    app.kubernetes.io/part-of: rss-stack
  name: rss-stack-config
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rss-stack
      app.kubernetes.io/name: rss-config
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app.kubernetes.io/instance: rss-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rss-config
        app.kubernetes.io/part-of: rss-stack
    spec:
      containers:
        - env:
            - name: SERVICE_FQDN
              value: rss-stack-config:3000
            - name: OTEL_EP
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: CONFIG_DB_DRIVER
              value: sqlite
            - name: CONFIG_DB_DSN
              value: /var/lib/rss-config/config.db
            - name: CONFIG_ADMIN_GROUPS
              value: admins
            - name: CONFIG_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  key: gateway-secret
                  name: rss-secrets
          image: ghcr.io/fkouhai/rss_config-x86_64-linux:2.0.0-rc-3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: config
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/rss-config
              name: data
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rss-stack-config
