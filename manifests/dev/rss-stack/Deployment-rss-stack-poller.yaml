apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rss-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss-poller
    app.kubernetes.io/part-of: rss-stack
  name: rss-stack-poller
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rss-stack
      app.kubernetes.io/name: rss-poller
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rss-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rss-poller
        app.kubernetes.io/part-of: rss-stack
    spec:
      containers:
        - env:
            - name: SERVICE_FQDN
              value: rss-stack-poller:3000
            - name: OTEL_EP
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: NATS_URL
              value: nats://rss-stack-nats.demo.svc.cluster.local:4222
            - name: POLLER_NATS_RETRY_BUDGET
              value: 60s
            - name: CONFIG_URL
              value: http://rss-stack-config:3000
            - name: CONFIG_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  key: gateway-secret
                  name: rss-secrets
            - name: DEFAULT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  key: webhook-url
                  name: rss-secrets
          image: ghcr.io/fkouhai/rss_poller-x86_64-linux:2.0.1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: poller
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      nodeSelector:
        kubernetes.io/arch: amd64
