apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rss-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rss-outbox
    app.kubernetes.io/part-of: rss-stack
  name: rss-stack-outbox
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rss-stack
      app.kubernetes.io/name: rss-outbox
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app.kubernetes.io/instance: rss-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rss-outbox
        app.kubernetes.io/part-of: rss-stack
    spec:
      containers:
        - env:
            - name: SERVICE_FQDN
              value: rss-stack-outbox:3000
            - name: OTEL_EP
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: NATS_URL
              value: nats://rss-stack-nats.demo.svc.cluster.local:4222
            - name: OUTBOX_NATS_RETRY_BUDGET
              value: 60s
            - name: OUTBOX_DB_DRIVER
              value: sqlite
            - name: OUTBOX_DB_DSN
              value: /var/lib/rss-outbox/outbox.db
          image: ghcr.io/fkouhai/rss-outbox_x86_64-linux:2.0.0-rc-3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: outbox
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/rss-outbox
              name: data
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rss-stack-outbox
